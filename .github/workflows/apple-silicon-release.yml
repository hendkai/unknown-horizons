name: Apple Silicon release

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: Native arm64 Python version used for the macOS bundle build
        required: true
        default: "3.11"
      fife-root:
        description: Optional path to a preinstalled native arm64 FIFE checkout on the runner
        required: false
        default: ""
  push:
    tags:
      - "20[0-9][0-9].*"
      - "v*"

permissions:
  contents: write

concurrency:
  group: apple-silicon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apple-silicon:
    name: Build native Apple Silicon DMG
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up native Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.11' }}
          architecture: arm64
          cache: pip

      - name: Install system packaging tools
        run: |
          brew update
          brew install gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Install Python packaging dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt py2app

      - name: Build Apple Silicon DMG
        env:
          PYTHON_BIN: python
          FIFE_ROOT: ${{ inputs.fife-root || '' }}
        run: scripts/build_apple_silicon_release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: unknown-horizons-apple-silicon
          path: |
            dist/Unknown-Horizons-*.dmg
            dist/Unknown-Horizons-*.dmg.sha256
          if-no-files-found: error

      - name: Attach DMG to tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Unknown-Horizons-*.dmg
            dist/Unknown-Horizons-*.dmg.sha256
