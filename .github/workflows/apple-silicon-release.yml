name: Apple Silicon Release

on:
  pull_request:
  push:
    branches:
      - master
      - ci/apple-silicon-release-workflow
      - task/sc-6-apple-silicon-release-workflow-pr-1-berw
    tags:
      - '20[0-9][0-9].[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging-tests:
    name: Packaging tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused packaging tests
        run: scripts/build_apple_silicon_release.sh --test-only

  release-build:
    name: Build Apple Silicon release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          brew update
          brew install gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt py2app setuptools

      - name: Build release artifacts
        run: scripts/build_apple_silicon_release.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unknown-horizons-apple-silicon
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
